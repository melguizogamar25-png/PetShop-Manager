<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:fragment="head_deps">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link th:href="@{/css/petshop.css}" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer></script>
</head>

<!-- Menu Publico -->
<nav th:fragment="menu" class="navbar navbar-expand-lg sticky-top pet-navbar">
    <div class="container">
        <a class="navbar-brand" th:href="@{/}">🐾 PetShop Manager</a>
        <button class="navbar-toggler border-0" type="button"
                data-bs-toggle="collapse" data-bs-target="#navPublic">
            <i class="bi bi-list fs-3 text-white"></i>
        </button>
        <div class="collapse navbar-collapse" id="navPublic">
            <ul class="navbar-nav mx-auto mb-2 mb-lg-0 gap-1">
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/productos/}">
                        <i class="bi bi-box-seam me-1"></i>Catálogo
                    </a>
                </li>
            </ul>
            <ul class="navbar-nav ms-auto">
                <li class="nav-item">
                    <a class="btn btn-light btn-sm rounded-pill" style="color:var(--verde);" th:href="@{/login}">
                        <i class="bi bi-box-arrow-in-right me-1"></i>Entrar
                    </a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<!-- Menu admin -->
<nav th:fragment="menu_admin" class="navbar navbar-expand-lg sticky-top pet-navbar">
    <div class="container">
        <a class="navbar-brand" th:href="@{/}">🐾 PetShop Manager</a>
        <button class="navbar-toggler border-0" type="button"
                data-bs-toggle="collapse" data-bs-target="#navAdmin">
            <i class="bi bi-list fs-3 text-white"></i>
        </button>
        <div class="collapse navbar-collapse" id="navAdmin">
            <ul class="navbar-nav mx-auto mb-2 mb-lg-0 gap-1">
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/productos/}"><i class="bi bi-box-seam me-1"></i>Productos</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/clientes/}"><i class="bi bi-people me-1"></i>Clientes</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/pedidos/}"><i class="bi bi-receipt me-1"></i>Pedidos</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/consultas/}"><i class="bi bi-bar-chart-line me-1"></i>Estadísticas</a>
                </li>
                <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                    <a class="nav-link nav-link-gold" th:href="@{/productos/nuevo}">
                        <i class="bi bi-plus-circle-fill me-1"></i>Nuevo producto
                    </a>
                </li>
            </ul>
            <ul class="navbar-nav ms-auto align-items-center gap-2">
                <li class="nav-item" sec:authorize="isAuthenticated()">
                    <span class="small text-white opacity-75 d-flex align-items-center gap-2">
                        <i class="bi bi-person-circle"></i>
                        <span sec:authentication="name">usuario</span>
                        <span class="badge-admin">Admin</span>
                    </span>
                </li>
                <li class="nav-item" sec:authorize="isAuthenticated()">
                    <a class="btn btn-outline-light btn-sm rounded-pill" th:href="@{/logout}">
                        <i class="bi bi-box-arrow-right me-1"></i>Salir
                    </a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<!--Menu usuario-->
<nav th:fragment="menu_user" class="navbar navbar-expand-lg sticky-top pet-navbar">
    <div class="container">
        <a class="navbar-brand" th:href="@{/}">🐾 PetShop Manager</a>
        <button class="navbar-toggler border-0" type="button"
                data-bs-toggle="collapse" data-bs-target="#navUser">
            <i class="bi bi-list fs-3 text-white"></i>
        </button>
        <div class="collapse navbar-collapse" id="navUser">
            <ul class="navbar-nav mx-auto mb-2 mb-lg-0 gap-1">
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/}"><i class="bi bi-house me-1"></i>Inicio</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/productos/}"><i class="bi bi-box-seam me-1"></i>Catálogo</a>
                </li>
            </ul>
            <ul class="navbar-nav ms-auto align-items-center gap-2">
                <li class="nav-item">
                    <a class="nav-link position-relative" th:href="@{/carrito}">
                        <i class="bi bi-cart3 text-white" style="font-size:1.2rem;"></i>
                        <span class="cart-badge"
                              th:if="${unidades_carrito != null and unidades_carrito > 0}"
                              th:text="${unidades_carrito}">0</span>
                    </a>
                </li>
                <li class="nav-item" sec:authorize="isAuthenticated()">
                    <span class="small text-white opacity-75 d-flex align-items-center gap-2">
                        <i class="bi bi-person-circle"></i>
                        <span sec:authentication="name">usuario</span>
                        <span class="badge-user">User</span>
                    </span>
                </li>
                <li class="nav-item">
                    <a class="btn btn-outline-light btn-sm rounded-pill" th:href="@{/logout}">
                        <i class="bi bi-box-arrow-right me-1"></i>Salir
                    </a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<footer th:fragment="footer" class="site-footer text-center mt-auto">
    <div class="container">
        <span>🐾 <strong>PetShop Manager</strong> &copy; 2025 &mdash; Spring Boot &amp; Thymeleaf</span>
    </div>
</footer>

</html>
