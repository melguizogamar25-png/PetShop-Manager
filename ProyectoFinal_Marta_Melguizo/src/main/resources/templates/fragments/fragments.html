<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:fragment="head_deps">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link th:href="@{/css/petshop.css}" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer></script>
</head>
<nav th:fragment="menu" class="navbar navbar-expand-lg sticky-top pet-navbar">
    <div class="container">

        <a class="navbar-brand" th:href="@{/}">
            <div class="brand-icon">🐾</div>
            PetShop Manager
        </a>

        <button class="navbar-toggler border-0" type="button"
                data-bs-toggle="collapse" data-bs-target="#navMain"
                style="color:rgba(255,255,255,0.7);">
            <i class="bi bi-list" style="font-size:1.4rem;"></i>
        </button>

        <div class="collapse navbar-collapse" id="navMain">
            <ul class="navbar-nav mx-auto mb-2 mb-lg-0 gap-1">
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/productos/}">
                        <i class="bi bi-box-seam"></i> Productos
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/clientes/}">
                        <i class="bi bi-people"></i> Clientes
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/pedidos/}">
                        <i class="bi bi-cart3"></i> Pedidos
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/consultas/}">
                        <i class="bi bi-bar-chart-line"></i> Estadísticas
                    </a>
                </li>
                <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                    <a class="nav-link nav-admin" th:href="@{/productos/nuevo}">
                        <i class="bi bi-plus-circle-fill"></i> Añadir producto
                    </a>
                </li>
            </ul>

            <ul class="navbar-nav ms-auto align-items-center gap-2">
                <li class="nav-item" sec:authorize="isAuthenticated()">
                    <span class="navbar-text text-white-50 small d-flex align-items-center gap-2">
                        <i class="bi bi-person-circle" style="font-size:1.1rem;color:#fff;"></i>
                        <span class="text-white" sec:authentication="name">usuario</span>
                        <span class="badge-role badge-admin" sec:authorize="hasRole('ADMIN')">Admin</span>
                        <span class="badge-role badge-user"  sec:authorize="hasRole('USER')">User</span>
                    </span>
                </li>
                <li class="nav-item" sec:authorize="isAuthenticated()">
                    <a class="btn-ghost btn btn-sm" th:href="@{/logout}">
                        <i class="bi bi-box-arrow-right"></i> Salir
                    </a>
                </li>
                <li class="nav-item" sec:authorize="!isAuthenticated()">
                    <a class="btn-pet btn btn-sm" th:href="@{/login}">
                        <i class="bi bi-box-arrow-in-right"></i> Entrar
                    </a>
                </li>
            </ul>
        </div>
    </div>
</nav>

</html>
