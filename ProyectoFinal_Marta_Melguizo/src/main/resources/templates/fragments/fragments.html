<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:fragment="head_deps">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link th:href="@{/css/petshop.css}" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer></script>
</head>
<nav th:fragment="menu_admin" class="navbar navbar-expand-lg navbar-dark sticky-top pet-navbar">
    <div class="container">
        <a class="navbar-brand fw-bold" th:href="@{/admin/index}">🐾 PetShop <span class="badge bg-warning text-dark ms-1">ADMIN</span></a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navAdmin">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navAdmin">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/productos/}"><i class="bi bi-box-seam me-1"></i>Productos</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/clientes/}"><i class="bi bi-people me-1"></i>Clientes</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/pedidos/}"><i class="bi bi-receipt me-1"></i>Pedidos</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/consultas/}"><i class="bi bi-bar-chart-line me-1"></i>Consultas</a>
                </li>
            </ul>
            <ul class="navbar-nav ms-auto align-items-center">
                <li class="nav-item me-3">
                    <span class="navbar-text text-light small">
                        <i class="bi bi-person-circle me-1"></i>
                        <span sec:authentication="name">admin</span>
                        <span class="badge bg-warning text-dark ms-1">ADMIN</span>
                    </span>
                </li>
                <li class="nav-item">
                    <a class="btn btn-outline-light btn-sm" th:href="@{/logout}">
                        <i class="bi bi-box-arrow-right me-1"></i>Salir
                    </a>
                </li>
            </ul>
        </div>
    </div>
</nav>
<nav th:fragment="menu_user" class="navbar navbar-expand-lg navbar-dark sticky-top pet-navbar">
    <div class="container">
        <a class="navbar-brand fw-bold" th:href="@{/user/index}">🐾 PetShop Manager</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navUser">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navUser">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/user/index}"><i class="bi bi-house me-1"></i>Inicio</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/productos/}"><i class="bi bi-box-seam me-1"></i>Catálogo</a>
                </li>
            </ul>
            <div class="d-flex align-items-center gap-3 me-3">
                <a th:href="@{/carrito}" class="btn btn-outline-light btn-sm position-relative">
                    <i class="bi bi-cart3 me-1"></i>Mi Carrito
                    <span class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger"
                          th:if="${unidades_carrito != null and unidades_carrito > 0}"
                          th:text="${unidades_carrito}">0</span>
                </a>
            </div>
            <ul class="navbar-nav align-items-center">
                <li class="nav-item me-3">
                    <span class="navbar-text text-light small">
                        <i class="bi bi-person-circle me-1"></i>
                        <span sec:authentication="name">user</span>
                        <span class="badge bg-info text-dark ms-1">USER</span>
                    </span>
                </li>
                <li class="nav-item">
                    <a class="btn btn-outline-light btn-sm" th:href="@{/logout}">
                        <i class="bi bi-box-arrow-right me-1"></i>Salir
                    </a>
                </li>
            </ul>
        </div>
    </div>
</nav>
<footer th:fragment="footer" class="footer text-center mt-auto">
    <div class="container">
        <span>🐾 PetShop Manager &copy; 2025 &mdash; Spring Boot &amp; Thymeleaf</span>
    </div>
</footer>

</html>
