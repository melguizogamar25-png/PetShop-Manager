<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/fragments :: head_deps}">
    <title>Confirmar Pedido — PetShop Manager</title>
</head>
<body class="d-flex flex-column min-vh-100">
<nav th:replace="~{fragments/fragments :: menu_user}"></nav>

<div class="seccion-header">
    <div class="container">
        <h5 class="fw-bold mb-0">📋 Confirmación del pedido</h5>
        <p class="mb-0 small opacity-75">Revisa tu pedido antes de confirmar</p>
    </div>
</div>

<div class="container py-4 flex-grow-1">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="ticket-wrap">
                <div class="ticket-header">
                    <div style="font-size:2rem;">🐾</div>
                    <div class="fw-bold mt-1">PetShop Manager</div>
                    <small class="opacity-75" th:text="${#temporals.format(#temporals.createNow(),'dd/MM/yyyy HH:mm')}">Fecha</small>
                </div>
                <div class="p-3">
                    <div th:each="entry : ${productos}">
                        <div class="d-flex justify-content-between align-items-start py-2">
                            <div>
                                <div class="fw-semibold small" th:text="${entry.key.nombre}">Producto</div>
                                <div class="text-muted" style="font-size:.78rem;"
                                     th:text="|${entry.value} x ${#numbers.formatDecimal(entry.key.precio, 1, 2)} €|"></div>
                            </div>
                            <span class="fw-bold small"
                                  th:text="|${#numbers.formatDecimal(entry.key.precio * entry.value, 1, 2)} €|">0.00 €</span>
                        </div>
                        <hr class="ticket-line">
                    </div>
                    <div class="d-flex justify-content-between fw-bold mt-2 pt-1">
                        <span>TOTAL (sin desc.):</span>
                        <span th:text="|${#numbers.formatDecimal(total_carrito, 1, 2)} €|">0.00 €</span>
                    </div>
                    <p class="text-muted small mt-3 mb-0">
                        * Los descuentos por tipo de mascota y condición de socio se aplicarán al confirmar.
                    </p>
                </div>
            </div>

            <div class="d-flex gap-3 justify-content-center mt-4">
                <a th:href="@{/carrito/confirmar}" class="btn btn-verde rounded-pill px-4">
                    <i class="bi bi-check-circle me-1"></i>Confirmar y pagar
                </a>
                <a th:href="@{/carrito}" class="btn btn-verde-outline rounded-pill px-4">
                    <i class="bi bi-arrow-left me-1"></i>Volver al carrito
                </a>
            </div>
        </div>
    </div>
</div>

<footer th:replace="~{fragments/fragments :: footer}"></footer>
</body>
</html>
