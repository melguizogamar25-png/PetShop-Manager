<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/fragments :: head_deps}">
    <title>Cliente — PetShop Manager</title>
</head>
<body class="d-flex flex-column min-vh-100">
<nav th:replace="~{fragments/fragments :: menu_admin}"></nav>

<div class="seccion-header">
    <div class="container">
        <h5 class="fw-bold mb-0" th:text="${cliente.id != null} ? '✏️ Editar cliente' : '👤 Nuevo cliente'">Cliente</h5>
        <p class="mb-0 small opacity-75">Completa los datos del cliente</p>
    </div>
</div>

<div class="container py-4 flex-grow-1" style="max-width:600px;">
    <div class="card border-0 shadow-sm">
        <div class="card-body p-4">
            <form th:action="${cliente.id != null} ? @{/clientes/editar/{id}(id=${cliente.id})} : @{/clientes/save}"
                  th:object="${cliente}" method="post">

                <div class="mb-3">
                    <label class="form-label fw-semibold small">Nombre completo <span class="text-danger">*</span></label>
                    <input type="text" class="form-control" th:field="*{nombre}"
                           th:errorclass="is-invalid" placeholder="Ej: María García López">
                    <div class="invalid-feedback" th:errors="*{nombre}"></div>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-semibold small">Email <span class="text-danger">*</span></label>
                    <input type="email" class="form-control" th:field="*{email}"
                           th:errorclass="is-invalid" placeholder="correo@ejemplo.com">
                    <div class="invalid-feedback" th:errors="*{email}"></div>
                </div>

                <div class="mb-3">
                    <label class="form-label fw-semibold small">Teléfono <span class="text-danger">*</span></label>
                    <input type="number" class="form-control" th:field="*{telefono}"
                           th:errorclass="is-invalid" placeholder="600000000">
                    <div class="invalid-feedback" th:errors="*{telefono}"></div>
                    <div class="form-text">9 dígitos sin espacios ni guiones.</div>
                </div>

                <div class="mb-4">
                    <div class="form-check form-switch">
                        <input class="form-check-input" type="checkbox" id="socioTienda" th:field="*{socioTienda}">
                        <label class="form-check-label fw-semibold small" for="socioTienda">
                            ⭐ Es socio de la tienda
                            <span class="fw-normal text-muted d-block" style="font-size:.8rem;">
                                Los socios obtienen descuentos adicionales en sus pedidos.
                            </span>
                        </label>
                    </div>
                </div>

                <hr class="my-3">
                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-verde rounded-pill px-4 flex-grow-1">
                        <i class="bi bi-check-circle me-1"></i>Guardar cliente
                    </button>
                    <a th:href="@{/clientes/}" class="btn btn-verde-outline rounded-pill px-4">
                        <i class="bi bi-arrow-left me-1"></i>Cancelar
                    </a>
                </div>
            </form>
        </div>
    </div>
</div>

<footer th:replace="~{fragments/fragments :: footer}"></footer>
</body>
</html>
