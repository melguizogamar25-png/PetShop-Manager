<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuevo Producto - PetShop Manager</title>
    <link href="../static/css/producto-form.css" rel="stylesheet">
</head>
<body>

    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card card-form">
                    <div class="header-form">
                        <h3 class="mb-0">Registro de Producto</h3>
                        <p class="mb-0 opacity-75">Introduce los datos para el catálogo</p>
                    </div>
                    <div class="card-body p-4">
                        
                        <form th:action="@{/productos/save}" th:object="${producto}" method="post">
                            
                            <input type="hidden" th:field="*{id}">

                            <div class="mb-3">
                                <label for="nombre" class="form-label">Nombre del Producto</label>
                                <input type="text" th:field="*{nombre}" class="form-control" id="nombre" placeholder="Ej: Pienso para perros adultos" required>
                            </div>

                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label for="precio" class="form-label">Precio (€)</label>
                                    <input type="number" step="0.01" th:field="*{precio}" class="form-control" id="precio" placeholder="0.00" required>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label for="stock" class="form-label">Stock inicial</label>
                                    <input type="number" th:field="*{stock}" class="form-control" id="stock" placeholder="Cantidad" required>
                                </div>
                            </div>

                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label for="tipoMascota" class="form-label">Tipo de Mascota</label>
                                    <select th:field="*{tipoMascota}" class="form-select" id="tipoMascota">
                                        <option th:each="tipo : ${T(com.salesianostriana.dam.model.TipoMascota).values()}" 
                                                th:value="${tipo}" 
                                                th:text="${tipo}">Tipo</option>
                                    </select>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label for="fechaCaducidad" class="form-label">Fecha de Caducidad</label>
                                    <input type="date" th:field="*{fechaCaducidad}" class="form-control" id="fechaCaducidad">
                                </div>
                            </div>

                            <div class="mb-3">
                                <label for="imagen" class="form-label">URL de la Imagen</label>
                                <input type="url" th:field="*{imagen}" class="form-control" id="imagen" placeholder="https://ejemplo.com/foto.jpg">
                            </div>

                            <div class="mb-3">
                                <label for="descripcion" class="form-label">Descripción</label>
                                <textarea th:field="*{descripcion}" class="form-control" id="descripcion" rows="3" placeholder="Breve descripción del producto..."></textarea>
                            </div>

                            <div class="form-check mb-4">
                                <input class="form-check-input" type="checkbox" th:field="*{devolucion}" id="devolucion">
                                <label class="form-check-label" for="devolucion">
                                    Permite devolución
                                </label>
                            </div>

                            <div class="d-grid gap-2">
                                <button type="submit" class="btn btn-success btn-save">Guardar Producto</button>
                                <a href="/productos/" class="btn btn-link text-muted">Cancelar y volver</a>
                            </div>

                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
