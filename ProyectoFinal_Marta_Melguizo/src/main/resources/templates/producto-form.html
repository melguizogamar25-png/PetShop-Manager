<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nuevo Producto - PetShop Manager</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link th:href="@{/css/producto-form.css}" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" defer></script>
</head>

<body>
    <nav class="navbar navbar-expand-lg sticky-top shadow-sm" style="background:#fff;border-bottom:3px solid #4caf7d;">
        <div class="container">
            <a class="navbar-brand fw-bold" style="font-family:'Playfair Display',serif;color:#1e7a4a;" href="/">
                🐾 PetShop Manager
            </a>
            <div>
                <a href="/productos/" class="btn" style="color:#1e7a4a;font-weight:700;border-radius:50px;">
                    <i class="bi bi-arrow-left me-1"></i>Volver al catálogo
                </a>
            </div>
        </div>
    </nav>

    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-lg-8 col-md-10">

                <div class="form-card">
                    <div class="form-header">
                        <div class="d-flex align-items-center gap-3">
                            <div
                                style="background:rgba(255,255,255,0.2);border-radius:14px;padding:0.75rem;font-size:1.8rem;line-height:1;">
                                📦</div>
                            <div>
                                <h3>Registro de Producto</h3>
                                <p>Introduce los datos para añadirlo al catálogo</p>
                            </div>
                        </div>
                    </div>
                    <div class="form-body">
                        <form th:action="@{/productos/save}" th:object="${producto}" method="post">
                            <input type="hidden" th:field="*{id}">
                            <div class="mb-4">
                                <label for="nombre" class="form-label">
                                    <i class="bi bi-tag field-icon"></i>Nombre del Producto
                                </label>
                                <input type="text" th:field="*{nombre}" class="form-control" id="nombre"
                                    placeholder="Ej: Pienso para perros adultos" required>
                            </div>

                            <div class="row g-3 mb-4">
                                <div class="col-md-6">
                                    <label for="precio" class="form-label">
                                        <i class="bi bi-currency-euro field-icon"></i>Precio (€)
                                    </label>
                                    <input type="number" step="0.01" th:field="*{precio}" class="form-control"
                                        id="precio" placeholder="0.00" required>
                                </div>
                                <div class="col-md-6">
                                    <label for="stock" class="form-label">
                                        <i class="bi bi-box field-icon"></i>Stock inicial
                                    </label>
                                    <input type="number" th:field="*{stock}" class="form-control" id="stock"
                                        placeholder="Cantidad" required>
                                </div>
                            </div>
                            <div class="row g-3 mb-4">
                                <div class="col-md-6">
                                    <label for="tipoMascota" class="form-label">
                                        <i class="bi bi-heart field-icon"></i>Tipo de Mascota
                                    </label>
                                    <select th:field="*{tipoMascota}" class="form-select" id="tipoMascota">
                                        <option th:each="tipo : ${tipos}" th:value="${tipo}" th:text="${tipo}">Tipo
                                        </option>
                                    </select>
                                </div>
                                <div class="col-md-6">
                                    <label for="fechaCaducidad" class="form-label">
                                        <i class="bi bi-calendar3 field-icon"></i>Fecha de Caducidad
                                    </label>
                                    <input type="date" th:field="*{fechaCaducidad}" class="form-control"
                                        id="fechaCaducidad">
                                </div>
                            </div>
                            <div class="mb-4">
                                <label for="imagen" class="form-label">
                                    <i class="bi bi-image field-icon"></i>URL de la Imagen
                                </label>
                                <input type="url" th:field="*{imagen}" class="form-control" id="imagen"
                                    placeholder="https://ejemplo.com/foto.jpg">
                            </div>
                            <div class="mb-4">
                                <label for="descripcion" class="form-label">
                                    <i class="bi bi-card-text field-icon"></i>Descripción
                                </label>
                                <textarea th:field="*{descripcion}" class="form-control" id="descripcion" rows="3"
                                    placeholder="Breve descripción del producto..."></textarea>
                            </div>
                            <div class="mb-4 p-3"
                                style="background:#f0faf4;border-radius:12px;border:2px solid #d6f0e0;">
                                <div class="form-check mb-0">
                                    <input class="form-check-input" type="checkbox" th:field="*{devolucion}"
                                        id="devolucion">
                                    <label class="form-check-label fw-bold" for="devolucion" style="color:#1e7a4a;">
                                        <i class="bi bi-arrow-return-left me-2"></i>Permite devolución
                                    </label>
                                </div>
                            </div>
                            <div class="d-grid gap-2">
                                <button type="submit" class="btn btn-save">
                                    <i class="bi bi-check-circle me-2"></i>Guardar Producto
                                </button>
                                <a th:href="@{/productos/}" class="btn btn-cancel text-decoration-none text-center">
                                    <i class="bi bi-x-circle me-2"></i>Cancelar y volver
                                </a>
                            </div>

                        </form>
                    </div>
                </div>

            </div>
        </div>
    </div>

</body>

</html>
