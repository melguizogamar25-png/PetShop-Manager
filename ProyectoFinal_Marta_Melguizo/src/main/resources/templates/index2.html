<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/fragments :: head_deps}">
    <title>Clientes - PetShop Manager</title>
</head>
<body>
    <nav th:replace="~{fragments/fragments :: menu}"></nav>
    <div style="background:linear-gradient(135deg,#1e7a4a,#4caf7d);color:white;padding:2.5rem 0;">
        <div class="container">
            <div class="d-flex align-items-center gap-3">
                <div style="background:rgba(255,255,255,0.15);border-radius:16px;padding:1rem;font-size:2rem;line-height:1;">👥</div>
                <div>
                    <h1 class="mb-0" style="font-family:'Playfair Display',serif;">Clientes</h1>
                    <p class="mb-0 mt-1" style="opacity:.85;">Gestión y consulta de la base de clientes</p>
                </div>
            </div>
        </div>
    </div>

    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-8 text-center">
                <div class="card p-5">
                    <div class="fs-1 mb-3">🚧</div>
                    <h4 class="fw-bold" style="color:var(--green-600,#1e7a4a);">Sección en construcción</h4>
                    <p class="text-muted">Aquí aparecerá la lista de clientes y la gestión de datos.</p>
                    <a th:href="@{/}" class="btn-pet btn mt-2" style="display:inline-block;width:auto;">
                        <i class="bi bi-house me-2"></i>Volver al inicio
                    </a>
                </div>
            </div>
        </div>
    </div>

    <footer class="footer text-center mt-5">
        <div class="container">
            <span>🐾 PetShop Manager &copy; 2025</span>
        </div>
    </footer>
</body>
</html>
