<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head th:replace="~{fragments/fragments :: head_deps}">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Compra Confirmada — PetShop Manager</title>
</head>

<body class="d-flex flex-column min-vh-100">
    <nav th:replace="~{fragments/fragments :: menu_user}"></nav>
    <div class="container py-5 flex-grow-1">
        <div class="row justify-content-center">
            <div class="col-md-6 text-center">
                <div class="card border-0 shadow-sm p-5">
                    <div style="font-size:3.5rem;" class="mb-3">✅</div>
                    <h4 class="fw-bold mb-2" style="color:var(--verde);">¡Pedido confirmado!</h4>
                    <p class="text-muted mb-4">Tu pedido ha sido registrado correctamente. Recibirás tu compra en breve.</p>
                    <div class="d-flex justify-content-center gap-3 flex-wrap">
                        <a th:href="@{/productos/}" class="btn btn-verde rounded-pill px-4">
                            <i class="bi bi-box-seam me-1"></i>Seguir comprando
                        </a>
                        <a th:href="@{/}" class="btn btn-verde-outline rounded-pill px-4">
                            <i class="bi bi-house me-1"></i>Inicio
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <footer th:replace="~{fragments/fragments :: footer}"></footer>
</body>

</html>
