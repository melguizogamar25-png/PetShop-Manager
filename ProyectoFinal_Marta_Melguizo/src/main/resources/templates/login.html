<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/fragments :: head_deps}">
    <title>Login – PetShop Manager</title>
</head>
<body>
<div class="login-wrapper">
    <div class="login-card card shadow-lg">
        <div class="login-header">
            <div style="font-size:3.5rem;">🐾</div>
            <h3 class="fw-bold mt-2 mb-0">PetShop Manager</h3>
            <p class="mb-0 small opacity-75">Accede a tu panel</p>
        </div>
        <div class="card-body p-4">

            <div th:if="${param.error}" class="alert alert-danger d-flex align-items-center mb-3">
                <i class="bi bi-exclamation-triangle-fill me-2"></i>
                Usuario o contraseña incorrectos.
            </div>
            <div th:if="${param.logout}" class="alert alert-success d-flex align-items-center mb-3">
                <i class="bi bi-check-circle-fill me-2"></i>
                Has cerrado sesión correctamente.
            </div>

            <form th:action="@{/login}" method="post">
                <div class="mb-3">
                    <label class="form-label fw-semibold"><i class="bi bi-person me-1"></i>Usuario</label>
                    <input type="text" name="username" class="form-control"
                           placeholder="admin o user" autofocus required>
                </div>
                <div class="mb-4">
                    <label class="form-label fw-semibold"><i class="bi bi-lock me-1"></i>Contraseña</label>
                    <input type="password" name="password" class="form-control"
                           placeholder="Contraseña" required>
                </div>
                <button type="submit" class="btn-pet btn w-100">
                    <i class="bi bi-box-arrow-in-right me-2"></i>Iniciar sesión
                </button>
            </form>

            <hr class="my-3">
            <div class="d-flex gap-3 justify-content-center">
                <div class="text-center small">
                    <span class="badge bg-warning text-dark">ADMIN</span>
                    <p class="mb-0 text-muted mt-1">admin / admin</p>
                </div>
                <div class="text-center small">
                    <span class="badge bg-info text-dark">USER</span>
                    <p class="mb-0 text-muted mt-1">user / user</p>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
