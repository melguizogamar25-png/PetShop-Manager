<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/fragments :: head_deps}">
    <title>Acceso — PetShop Manager</title>
</head>
<body>
<div class="login-bg">
    <div class="login-card">

        <div class="login-top">
            <div class="login-logo">🐾</div>
            <h2>PetShop Manager</h2>
            <p>Accede a tu panel de gestión</p>
        </div>

        <div class="login-body">

            <div th:if="${param.error}"
                 class="alert d-flex align-items-center gap-2 mb-3 py-2"
                 style="background:#fef2f2;border:1px solid #fecaca;border-radius:10px;font-size:0.875rem;color:#991b1b;">
                <i class="bi bi-exclamation-circle-fill flex-shrink-0"></i>
                Usuario o contraseña incorrectos. Inténtalo de nuevo.
            </div>

            <div th:if="${param.logout}"
                 class="alert d-flex align-items-center gap-2 mb-3 py-2"
                 style="background:#f0fdf4;border:1px solid #bbf7d0;border-radius:10px;font-size:0.875rem;color:#166534;">
                <i class="bi bi-check-circle-fill flex-shrink-0"></i>
                Has cerrado sesión correctamente.
            </div>

            <form th:action="@{/login}" method="post">
                <div class="mb-3">
                    <label class="form-label">
                        <i class="bi bi-person text-leaf"></i> Usuario
                    </label>
                    <input type="text" name="username" class="form-control"
                           placeholder="admin o user" autofocus required>
                </div>
                <div class="mb-4">
                    <label class="form-label">
                        <i class="bi bi-lock text-leaf"></i> Contraseña
                    </label>
                    <input type="password" name="password" class="form-control"
                           placeholder="Contraseña" required>
                </div>
                <button type="submit" class="btn-pet btn w-100"
                        style="justify-content:center;padding:.75rem;">
                    <i class="bi bi-box-arrow-in-right"></i> Iniciar sesión
                </button>
            </form>

            <div style="margin-top:1.5rem;padding-top:1.2rem;border-top:1px solid rgba(26,58,42,0.1);">
                <p class="text-center mb-2" style="font-size:0.78rem;color:var(--text-soft);text-transform:uppercase;letter-spacing:.06em;font-weight:600;">
                    Cuentas de demo
                </p>
                <div class="d-flex gap-3 justify-content-center">
                    <div class="text-center"
                         style="background:rgba(201,168,76,0.1);border:1px solid rgba(201,168,76,0.25);border-radius:10px;padding:.6rem 1rem;">
                        <span class="badge-role badge-admin d-block mb-1">Admin</span>
                        <span style="font-size:0.8rem;color:var(--text-mid);">admin / admin</span>
                    </div>
                    <div class="text-center"
                         style="background:rgba(116,198,157,0.1);border:1px solid rgba(116,198,157,0.25);border-radius:10px;padding:.6rem 1rem;">
                        <span class="badge-role badge-user d-block mb-1">User</span>
                        <span style="font-size:0.8rem;color:var(--text-mid);">user / user</span>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
