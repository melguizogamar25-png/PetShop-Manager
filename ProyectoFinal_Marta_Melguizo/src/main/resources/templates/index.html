<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PetShop Manager</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <style>
        :root {
            --petshop-green: #28a745;
            --petshop-orange: #ff9900;
            --petshop-bg: #f8f9fa;
        }
        body { background-color: var(--petshop-bg); }
        .navbar-custom { background-color: var(--petshop-green); }
        .navbar-custom .navbar-brand, .navbar-custom .nav-link { color: white; }
        .btn-comprar {
            background-color: var(--petshop-orange);
            color: white;
            font-weight: bold;
        }
        .btn-comprar:hover { background-color: #e68a00; color: white; }
        .card-img-top { height: 200px; object-fit: cover; }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-custom shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" href="/">PetShop Manager</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-toggle="navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="/">Catálogo</a></li>
                    <li class="nav-item"><a class="nav-link" href="/pedidos">Mis Pedidos</a></li>
                    <li class="nav-item"><a class="nav-link" href="/login">Acceder</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-5">
        <h2 class="text-center mb-4" style="color: var(--petshop-green);">Nuestro Catálogo para Mascotas</h2>
        
        <div class="row">
            <div class="col-md-4 mb-4" th:each="producto : ${productos}">
                <div class="card h-100 shadow-sm">
                    <img th:src="${producto.imagen != null ? producto.imagen : 'https://via.placeholder.com/300x200?text=Mascotas'}" class="card-img-top" alt="Producto">
                    <div class="card-body text-center">
                        <span class="badge bg-secondary mb-2" th:text="${producto.tipoMascota}">Perro</span>
                        <h5 class="card-title" th:text="${producto.nombre}">Nombre Producto</h5>
                        <h4 class="text-success fw-bold" th:text="${producto.precio + ' €'}">10.00 €</h4>
                        <p class="text-muted small" th:text="'Stock: ' + ${producto.stock}">Stock: 5</p>
                    </div>
                    <div class="card-footer bg-white border-0 text-center pb-3">
                        <button class="btn btn-comprar w-100">Añadir al Carrito</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
