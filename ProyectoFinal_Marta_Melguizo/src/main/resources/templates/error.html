<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/fragments :: head_deps}">
    <title>Error — PetShop Manager</title>
</head>
<body class="d-flex flex-column min-vh-100">
<nav th:replace="~{fragments/fragments :: menu}"></nav>

<div class="error-wrap container flex-grow-1">
    <div class="col-md-5 mx-auto text-center">
        <div class="card border-0 shadow-sm p-4">
            <i class="bi bi-exclamation-triangle-fill mb-3" style="font-size:3rem;color:#dc3545;display:block;"></i>
            <h5 class="fw-bold mb-2" th:text="${errorTitulo} ?: 'Ha ocurrido un error'">Error</h5>
            <p class="text-muted mb-1" th:text="${errorMensaje} ?: 'Se ha producido un error inesperado.'">Detalle.</p>
            <p class="small text-muted mb-4">Si el problema persiste, contacta con el administrador.</p>
            <div class="d-flex justify-content-center gap-2">
                <a th:href="@{/}" class="btn btn-verde rounded-pill px-4">
                    <i class="bi bi-house me-1"></i>Volver al inicio
                </a>
                <a href="javascript:history.back()" class="btn btn-verde-outline rounded-pill px-4">
                    <i class="bi bi-arrow-left me-1"></i>Atrás
                </a>
            </div>
        </div>
    </div>
</div>

<footer th:replace="~{fragments/fragments :: footer}"></footer>
</body>
</html>
