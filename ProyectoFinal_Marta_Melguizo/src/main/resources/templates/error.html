<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/fragments :: head_deps}">
    <title>Error – PetShop Manager</title>
</head>
<body>
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-7">
            <div class="card border-0 shadow-lg overflow-hidden">
                <div class="card-header py-4 text-center"
                     style="background: linear-gradient(135deg,#c0392b,#e74c3c);">
                    <div style="font-size:3.5rem;">⚠️</div>
                    <h3 class="text-white mb-0 mt-2"
                        th:text="${errorTitulo} ?: 'Ha ocurrido un error'">Error</h3>
                </div>
                <div class="card-body text-center p-5">
                    <p class="fs-5 text-secondary mb-4"
                       th:text="${errorMensaje} ?: 'Se ha producido un error inesperado.'">
                        Detalle del error.
                    </p>
                    <hr>
                    <div class="d-flex justify-content-center gap-3 mt-4">
                        <a th:href="@{/}" class="btn-pet btn">
                            <i class="bi bi-house me-1"></i>Volver al inicio
                        </a>
                        <button onclick="history.back()" class="btn btn-outline-secondary">
                            <i class="bi bi-arrow-left me-1"></i>Atrás
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
<footer th:replace="~{fragments/fragments :: footer}"></footer>
</body>
</html>
