<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/fragments :: head_deps}">
    <title>Error — PetShop Manager</title>
</head>
<body class="d-flex flex-column min-vh-100">
<nav th:replace="~{fragments/fragments :: menu}"></nav>

<div class="error-wrap container flex-grow-1">
    <div class="row justify-content-center w-100">
        <div class="col-md-6 col-lg-5">
            <div class="card border-0 shadow-sm text-center" style="border-radius:16px;overflow:hidden;">
                <div style="background:linear-gradient(135deg,#7f1d1d,#b91c1c);padding:2.5rem 2rem;">
                    <div style="font-size:3.5rem;">⚠️</div>
                    <h4 class="text-white fw-bold mt-2 mb-0"
                        th:text="${errorTitulo} ?: 'Ha ocurrido un error'">Error</h4>
                </div>
                <div class="card-body p-4">
                    <p class="text-muted mb-3"
                       th:text="${errorMensaje} ?: 'Se ha producido un error inesperado. Inténtalo de nuevo.'">
                        Detalle del error.
                    </p>
                    <p class="small text-muted mb-4">
                        Si el problema persiste, contacta con el administrador.
                    </p>
                    <div class="d-flex justify-content-center gap-2 flex-wrap">
                        <a th:href="@{/}" class="btn btn-verde rounded-pill px-4">
                            <i class="bi bi-house me-1"></i>Volver al inicio
                        </a>
                        <a th:href="javascript:history.back()" class="btn btn-verde-outline rounded-pill px-4">
                            <i class="bi bi-arrow-left me-1"></i>Atrás
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<footer th:replace="~{fragments/fragments :: footer}"></footer>
</body>
</html>
