<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/fragments :: head_deps}">
    <title>Mi área — PetShop Manager</title>
</head>
<body class="d-flex flex-column min-vh-100">
<nav th:replace="~{fragments/fragments :: menu_user}"></nav>

<div class="seccion-header">
    <div class="container d-flex align-items-center justify-content-between">
        <div>
            <h5 class="fw-bold mb-0">¡Hola, <span sec:authentication="name">usuario</span>!</h5>
            <p class="mb-0 small opacity-75">Explora el catálogo y haz tus compras.</p>
        </div>
        <span class="badge-user">Usuario</span>
    </div>
</div>

<div class="container py-5 flex-grow-1">
    <div class="row g-3 justify-content-center">
        <div class="col-md-5">
            <div class="card h-100 border-0 shadow-sm text-center p-4">
                <div class="fs-2 mb-2">📦</div>
                <h6 class="fw-bold" style="color:var(--verde);">Catálogo</h6>
                <p class="small text-muted flex-grow-1">Explora todos los productos disponibles para tu mascota.</p>
                <a th:href="@{/productos/}" class="btn btn-verde btn-sm rounded-pill w-100">
                    <i class="bi bi-arrow-right-circle me-1"></i>Ver catálogo
                </a>
            </div>
        </div>
        <div class="col-md-5">
            <div class="card h-100 border-0 shadow-sm text-center p-4">
                <div class="fs-2 mb-2">🛒</div>
                <h6 class="fw-bold" style="color:var(--verde);">Mi carrito</h6>
                <p class="small text-muted flex-grow-1">Revisa los productos añadidos antes de confirmar.</p>
                <a th:href="@{/carrito}" class="btn btn-verde btn-sm rounded-pill w-100">
                    <i class="bi bi-cart3 me-1"></i>Ir al carrito
                </a>
            </div>
        </div>
    </div>
</div>

<footer th:replace="~{fragments/fragments :: footer}"></footer>
</body>
</html>
