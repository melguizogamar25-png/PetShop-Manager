<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/fragments :: head_deps}">
    <title>Clientes — PetShop Manager</title>
</head>
<body class="d-flex flex-column min-vh-100">
<nav th:replace="~{fragments/fragments :: menu}"></nav>

<div class="seccion-header">
    <div class="container d-flex flex-wrap align-items-center justify-content-between gap-3">
        <div class="d-flex align-items-center gap-3">
            <div style="background:rgba(255,255,255,0.15);border-radius:10px;width:46px;height:46px;display:flex;align-items:center;justify-content:center;font-size:1.5rem;">👥</div>
            <div>
                <h4 class="text-white fw-bold mb-0">Gestión de Clientes</h4>
                <p class="text-white mb-0" style="opacity:.75;font-size:.875rem;">Consulta, filtra y gestiona tu base de clientes</p>
            </div>
        </div>
        <a th:href="@{/clientes/nuevo}" class="btn btn-light btn-sm rounded-pill fw-semibold"
           style="color:var(--verde);" sec:authorize="hasRole('ADMIN')">
            <i class="bi bi-person-plus me-1"></i>Nuevo cliente
        </a>
    </div>
</div>

<div class="container py-4 flex-grow-1">

    <!-- Filtros -->
    <div class="card border-0 shadow-sm mb-4 p-3">
        <div class="row g-2 align-items-center">
            <div class="col-md-6">
                <form th:action="@{/clientes/}" method="get" class="d-flex gap-2">
                    <input type="text" name="buscar" class="form-control form-control-sm"
                           placeholder="Buscar por nombre..." th:value="${buscar}">
                    <button type="submit" class="btn btn-verde btn-sm px-3">
                        <i class="bi bi-search"></i>
                    </button>
                </form>
            </div>
            <div class="col-md-3">
                <a th:href="@{/clientes/?socios=true}"
                   class="btn btn-sm w-100 rounded-pill"
                   th:classappend="${filtroSocios} ? 'btn-verde' : 'btn-verde-outline'">
                    <i class="bi bi-star-fill me-1"></i>Solo socios
                </a>
            </div>
            <div class="col-md-3">
                <a th:href="@{/clientes/}" class="btn btn-verde-outline btn-sm w-100 rounded-pill">
                    <i class="bi bi-x-circle me-1"></i>Limpiar
                </a>
            </div>
        </div>
    </div>
    <div class="card border-0 shadow-sm p-0">
        <div class="table-responsive">
            <table class="table tabla-verde align-middle mb-0">
                <thead>
                    <tr>
                        <th class="ps-4">#</th>
                        <th>Nombre</th>
                        <th>Email</th>
                        <th>Teléfono</th>
                        <th class="text-center">Socio</th>
                        <th class="text-center">Pedidos</th>
                        <th class="text-center pe-4" sec:authorize="hasRole('ADMIN')">Acciones</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="c : ${clientes}">
                        <td class="ps-4 text-muted small" th:text="${c.id}">1</td>
                        <td class="fw-semibold" style="color:var(--verde);" th:text="${c.nombre}">—</td>
                        <td>
                            <a th:href="'mailto:' + ${c.email}" th:text="${c.email}"
                               class="text-decoration-none small" style="color:var(--verde-med);">—</a>
                        </td>
                        <td class="small" th:text="${c.telefono}">—</td>
                        <td class="text-center">
                            <span th:if="${c.socioTienda}"
                                  style="background:#fff8e1;color:#92400e;border:1px solid #fde68a;border-radius:50px;font-size:.72rem;font-weight:700;padding:2px 10px;display:inline-block;">
                                ⭐ Socio
                            </span>
                            <span th:unless="${c.socioTienda}"
                                  style="background:#f3f4f6;color:#9ca3af;border:1px solid #e5e7eb;border-radius:50px;font-size:.72rem;padding:2px 10px;display:inline-block;">
                                No
                            </span>
                        </td>
                        <td class="text-center">
                            <span style="background:var(--menta);color:var(--verde);font-size:.72rem;font-weight:700;border-radius:50px;padding:2px 10px;display:inline-block;"
                                  th:text="${c.pedidos.size()}">0</span>
                        </td>
                        <td class="text-center pe-4" sec:authorize="hasRole('ADMIN')">
                            <div class="d-flex justify-content-center gap-1">
                                <a th:href="@{/clientes/editar/{id}(id=${c.id})}"
                                   class="btn btn-sm btn-outline-primary rounded-pill"
                                   style="font-size:.75rem;padding:2px 10px;">
                                    <i class="bi bi-pencil"></i> Editar
                                </a>
                                <a th:href="@{/clientes/borrar/{id}(id=${c.id})}"
                                   class="btn btn-sm btn-outline-danger rounded-pill"
                                   style="font-size:.75rem;padding:2px 8px;"
                                   onclick="return confirm('¿Eliminar a este cliente y todos sus pedidos?')">
                                    <i class="bi bi-trash"></i>
                                </a>
                            </div>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(clientes)}">
                        <td colspan="7" class="text-center py-5 text-muted">
                            <div style="font-size:2.5rem;margin-bottom:.5rem;">👤</div>
                            No hay clientes registrados.
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<footer th:replace="~{fragments/fragments :: footer}"></footer>
</body>
</html>
