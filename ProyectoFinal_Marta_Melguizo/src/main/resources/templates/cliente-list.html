<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments/fragments :: head_deps}">
    <title>Clientes — PetShop Manager</title>
</head>
<body>
<nav th:replace="~{fragments/fragments :: menu}"></nav>

<div class="page-header">
    <div class="container position-relative">
        <div class="d-flex flex-wrap align-items-center justify-content-between gap-3">
            <div class="d-flex align-items-center gap-3">
                <div class="ph-icon">👥</div>
                <div>
                    <h1>Gestión de Clientes</h1>
                    <p>Consulta, filtra y gestiona tu base de clientes</p>
                </div>
            </div>
            <a th:href="@{/clientes/nuevo}" class="btn-light-outline" sec:authorize="hasRole('ADMIN')">
                <i class="bi bi-person-plus-fill"></i> Nuevo cliente
            </a>
        </div>
    </div>
</div>

<div class="container py-4">
    <div class="filter-bar mb-4">
        <div class="row g-2 align-items-center">
            <div class="col-md-5">
                <form th:action="@{/clientes/}" method="get" class="d-flex gap-2">
                    <div class="input-group">
                        <span class="input-group-text" style="background:var(--cream);border-color:rgba(26,58,42,0.15);border-right:none;">
                            <i class="bi bi-search text-leaf"></i>
                        </span>
                        <input type="text" name="buscar" class="form-control"
                               placeholder="Buscar por nombre..." th:value="${buscar}"
                               style="border-left:none;">
                    </div>
                    <button type="submit" class="btn-pet btn px-3">Buscar</button>
                </form>
            </div>
            <div class="col-md-4">
                <a th:href="@{/clientes/?socios=true}"
                   class="btn w-100"
                   th:classappend="${filtroSocios} ? 'btn-pet' : 'btn-pet-outline'"
                   style="justify-content:center;">
                    <i class="bi bi-star-fill"></i> Solo socios ⭐
                </a>
            </div>
            <div class="col-md-3">
                <a th:href="@{/clientes/}" class="btn-pet-outline btn w-100" style="justify-content:center;">
                    <i class="bi bi-x-circle"></i> Limpiar
                </a>
            </div>
        </div>
    </div>
    <div class="card p-0">
        <div class="table-scroll">
            <table class="table table-petshop align-middle mb-0">
                <thead>
                    <tr>
                        <th class="ps-4">#</th>
                        <th>Nombre</th>
                        <th>Email</th>
                        <th>Teléfono</th>
                        <th class="text-center">Socio</th>
                        <th class="text-center">Pedidos</th>
                        <th class="text-center pe-4" sec:authorize="hasRole('ADMIN')">Acciones</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="c : ${clientes}">
                        <td class="ps-4 text-muted" style="font-size:0.8rem;" th:text="${c.id}">1</td>
                        <td>
                            <div class="fw-semibold" style="color:var(--forest);" th:text="${c.nombre}">Nombre</div>
                        </td>
                        <td>
                            <a th:href="'mailto:' + ${c.email}" th:text="${c.email}"
                               class="text-decoration-none" style="color:var(--leaf);font-size:0.875rem;"></a>
                        </td>
                        <td style="font-size:0.875rem;" th:text="${c.telefono}">600000000</td>
                        <td class="text-center">
                            <span th:if="${c.socioTienda}"
                                  style="background:#fef9c3;color:#713f12;border:1px solid #fde047;border-radius:100px;font-size:0.72rem;font-weight:700;padding:3px 10px;display:inline-block;">
                                ⭐ Socio
                            </span>
                            <span th:unless="${c.socioTienda}"
                                  style="background:#f3f4f6;color:#6b7280;border:1px solid #e5e7eb;border-radius:100px;font-size:0.72rem;padding:3px 10px;display:inline-block;">
                                No
                            </span>
                        </td>
                        <td class="text-center">
                            <span style="background:var(--mint);color:var(--forest);font-size:0.72rem;font-weight:700;border-radius:100px;padding:3px 10px;display:inline-block;"
                                  th:text="${c.pedidos.size()}">0</span>
                        </td>
                        <td class="text-center pe-4" sec:authorize="hasRole('ADMIN')">
                            <div class="d-flex justify-content-center gap-2">
                                <a th:href="@{/clientes/editar/{id}(id=${c.id})}"
                                   class="btn btn-sm btn-outline-primary rounded-pill" style="font-size:0.78rem;padding:3px 10px;">
                                    <i class="bi bi-pencil"></i> Editar
                                </a>
                                <a th:href="@{/clientes/borrar/{id}(id=${c.id})}"
                                   class="btn btn-sm btn-outline-danger rounded-pill" style="font-size:0.78rem;padding:3px 10px;"
                                   onclick="return confirm('¿Eliminar a este cliente y todos sus pedidos?')">
                                    <i class="bi bi-trash"></i>
                                </a>
                            </div>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(clientes)}">
                        <td colspan="7" class="text-center py-5">
                            <div style="font-size:2.5rem;margin-bottom:.75rem;">👤</div>
                            <p class="mb-0 text-muted">No hay clientes registrados.</p>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

</div>

<footer class="site-footer text-center mt-5">
    <div class="container">
        <span>🐾 <strong>PetShop Manager</strong> &copy; 2025</span>
    </div>
</footer>
</body>
</html>
