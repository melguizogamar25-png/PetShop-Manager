<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head_deps}"></head>
<body>
    <nav th:replace="~{fragments :: menu}"></nav>
    <div class="container mt-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2>Nuestro Catálogo</h2>
            <a href="/productos/nuevo" class="btn btn-pet"> + Añadir Producto</a>
        </div>
        <div class="row">
            <div class="col-md-4 mb-4" th:each="p : ${productos}">
                <div class="card h-100 p-3">
                    <img th:src="${p.imagen}" class="card-img-top" alt="Producto" style="max-height: 150px; object-fit: contain;">
                    <div class="card-body text-center">
                        <h5 class="card-title fw-bold" th:text="${p.nombre}">Nombre</h5>
                        <p class="badge bg-info text-dark" th:text="${p.tipoMascota}">Tipo</p>
                        <p class="card-text text-success fs-4 fw-bold" th:text="${p.precio} + ' €'">0.00 €</p>
                        <p class="text-muted" th:text="'Stock: ' + ${p.stock}">Stock</p>
                        <a href="#" class="btn btn-outline-success btn-sm w-100">Ver detalles</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
